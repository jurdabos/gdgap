[project]
name = "gdgap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "acidbase",
    "click>=8.4.2",
]

[tool.uv.sources]
acidbase = { git = "https://github.com/jurdabos/acidbase.git" }

[project.scripts]
gdgap = "gdgap.cli:main"

[tool.hatch.metadata]
# Required for the `acidbase @ git+https://...` direct reference (and any future ones).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gdgap"]

# Append this block to a repo's pyproject.toml.
# This is the canonical ruff configuration for the a6a ecosystem.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
# Conservative starting selection that mirrors the legacy flake8 + isort
# coverage. Broaden to ["E","W","F","I","B","UP","SIM","RUF"] per repo once
# the existing code is clean (use `ruff check --fix` / `--unsafe-fixes` first).
# E,W = pycodestyle       F = pyflakes (incl. F401/F541/F821)       I = isort
select = ["E", "W", "F", "I"]
# E203 conflicts with the ruff formatter; ruff itself doesn't emit W503 (that's flake8-only).
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Long string fixtures and import-only test stubs are acceptable.
"tests/**/*.py" = ["E501", "F401"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
